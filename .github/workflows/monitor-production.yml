name: Monitor production readiness

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-production-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check liveness
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 https://employee-attendance.floweaversolutions.workers.dev/api/v2/health/live

      - name: Check database readiness
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 https://employee-attendance.floweaversolutions.workers.dev/api/v2/health/ready
