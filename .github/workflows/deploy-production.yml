name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or tag already verified in staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout approved revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply production migrations
        run: npm run db:deploy

      - name: Deploy production Worker
        run: npm run deploy:production

      - name: Verify production readiness
        run: curl --fail --retry 5 --retry-delay 3 https://employee-attendance.floweaversolutions.workers.dev/api/v2/health/ready
